version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          vite:
              patterns: ['vite', '@vitejs/*']
          typescript-eslint:
              patterns: ['typescript-eslint', '@typescript-eslint/*']
      # Expo pins its own toolchain; upgrade it with `npx expo install --fix`.
      ignore:
          - dependency-name: expo
          - dependency-name: 'expo-*'
          - dependency-name: '@expo/*'
          - dependency-name: react-native
          # A native module's major needs a device build to verify; take it with the
          # next Expo SDK upgrade.
          - dependency-name: react-native-google-mobile-ads
            update-types: ['version-update:semver-major']
          # typescript-eslint does not support TypeScript 7 yet.
          - dependency-name: typescript
            versions: ['>=7']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
