version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          vite:
              patterns: ['vite', '@vitejs/*']
          typescript-eslint:
              patterns: ['typescript-eslint', '@typescript-eslint/*']
          # Each Expo SDK is tested against one version of these, so they move
          # together in one PR. A new SDK major is applied in apps/mobile with
          # `bunx expo install expo@^<N>.0.0 --fix` and `bunx expo-doctor`, one
          # SDK at a time. CI runs `expo install --check`, so an update that moves a
          # package off the versions the SDK pins fails instead of auto-merging.
          expo:
              patterns:
                  - expo
                  - 'expo-*'
                  - '@expo/*'
                  - babel-preset-expo
                  - react-native
                  - 'react-native-*'
                  - '@shopify/react-native-skia'
      ignore:
          # `typescript` is an alias for @typescript/typescript6, the API that
          # typescript-eslint and the Expo/Metro tooling load; TypeScript 7 itself
          # (`tsc`) updates through @typescript/native, so the alias key must not
          # be bumped to 7.
          - dependency-name: typescript
            versions: ['>=7']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
