version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      # Expo pins its own toolchain; upgrade it with `npx expo install --fix`.
      ignore:
          - dependency-name: expo
          - dependency-name: "expo-*"
          - dependency-name: "@expo/*"
          - dependency-name: react-native
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
