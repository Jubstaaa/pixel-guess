name: Deploy web

# Only the web app is deployed from here. The mobile app ships through EAS, and
# the game images are published separately with `bun run sync:images`.
on:
    push:
        branches: [main]
        paths:
            - 'apps/web/**'
            - 'packages/shared/**'
            - 'bun.lock'
            - 'package.json'
            - 'turbo.json'
            - 'tsconfig.base.json'
            - 'bunfig.toml'
            - '.github/workflows/deploy-web.yml'
    workflow_dispatch:

permissions:
    contents: read

# Never cancel a release halfway through the upload.
concurrency:
    group: deploy-web
    cancel-in-progress: false

# No CI re-run here: the protect-main ruleset requires the `check` job to pass
# on a branch that is up to date with main, so what lands is what was tested.
jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build --filter=@pixel-guess/web
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            # Atomic release: the site switches to the new build in one rename, and
            # goes back to the previous one if it does not answer.
            - uses: Jubstaaa/deploy-actions/static@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  source-dir: apps/web/dist
                  site: pixelguess
                  health-url: https://pixelguessgame.com/
