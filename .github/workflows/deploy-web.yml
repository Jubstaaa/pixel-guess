name: Deploy web

on:
    push:
        branches: [main]
        paths:
            - 'apps/web/**'
            - 'packages/shared/**'
            - 'bun.lock'
            - 'package.json'
            - 'turbo.json'
            - 'tsconfig.base.json'
            - 'bunfig.toml'
            - '.github/workflows/deploy-web.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-web
    cancel-in-progress: false

jobs:
    deploy:
        environment: Production
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run build --filter=@pixel-guess/web
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            - uses: Jubstaaa/deploy-actions/static@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  source-dir: apps/web/dist
                  site: pixelguess
                  health-url: https://pixelguessgame.com/
