name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            # Installs the mobile workspace too, which is heavier than this job
            # needs, but --frozen-lockfile is what keeps the lockfile honest.
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run type-check
            - run: bun run audit
            - run: bun run build --filter=@pixel-guess/web
            # If the CDN base URL ever falls out of the bundle, every game image
            # 404s while the build still looks perfectly healthy.
            - name: Sanity-check the web build
              run: |
                  test -s apps/web/dist/index.html
                  test "$(find apps/web/dist -type f | wc -l)" -ge 10
                  grep -rq 'pixelguess.fra1.cdn.digitaloceanspaces.com' apps/web/dist/assets/
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
