<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Only the directives that cannot break AdSense (loaded by the ad
             slots), which injects scripts and frames from many Google hosts. The rest of the header set
             (HSTS, nosniff, frame-ancestors, a full CSP) has to come from the
             server, because a meta tag cannot carry those. -->
        <meta
            http-equiv="Content-Security-Policy"
            content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
        />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="Pixel Guess" />
        <meta name="apple-itunes-app" content="app-id=6760237625" />

        <!-- Every game image is fetched from this origin, so pay the DNS,
             TCP and TLS cost up front instead of on the first guess. The
             crossorigin attribute has to be here too: the images are loaded
             in CORS mode, and a non-CORS preconnect would open a second,
             unused connection. -->
        <link
            rel="preconnect"
            href="https://pixelguess.fra1.cdn.digitaloceanspaces.com"
            crossorigin
        />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link rel="manifest" href="/site.webmanifest" />

        <meta
            property="og:title"
            content="Pixel Guess: Guess Hidden Images by Pixel | Fun Image Guessing Game"
        />
        <meta
            property="og:description"
            content="Join Pixel Guess and challenge yourself to guess hidden images, pixel by pixel. Choose your favorite category and start guessing today. Fun and addictive image guessing game for all ages."
        />
        <meta property="og:url" content="https://pixelguessgame.com" />
        <meta property="og:site_name" content="Pixel Guess" />
        <meta
            property="og:image"
            content="https://pixelguessgame.com/images/pixel_guess_logo.webp"
        />
        <meta property="og:image:width" content="521" />
        <meta property="og:image:height" content="521" />
        <meta
            property="og:image:alt"
            content="Pixel Guess: Fun Image Guessing Game"
        />
        <meta property="og:locale" content="en_US" />
        <meta property="og:type" content="website" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Pixel Guess: Guess Hidden Images by Pixel | Fun Image Guessing Game"
        />
        <meta
            name="twitter:description"
            content="Join Pixel Guess and challenge yourself to guess hidden images, pixel by pixel. Fun and addictive image guessing game for all ages."
        />
        <meta
            name="twitter:image"
            content="https://pixelguessgame.com/images/pixel_guess_logo.webp"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Pixel Guess",
                "description": "Join Pixel Guess and challenge yourself to guess hidden images, pixel by pixel.",
                "genre": "Puzzle",
                "gamePlatform": "Web",
                "offers": {
                    "@type": "Offer",
                    "price": "0.00",
                    "priceCurrency": "USD"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
